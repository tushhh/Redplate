name: Build APK

# Builds an installable debug APK on GitHub's runners.
#
# This exists because the app cannot always be built where it is being edited — a
# container without the Android SDK, or a laptop that is not to hand. The runner has the
# SDK and can reach Google's Maven, so the APK is downloadable from the run's artifacts.
#
# The APK is built before the tests run, and uploaded straight after, so a failing test
# still leaves something installable behind. The job still goes red — the tests are the
# quality gate, they are just not the delivery gate.

on:
  push:
    branches:
      - master
      - "claude/**"
      - "kiro/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Write access only so the schema step below can push the exported Room schema.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # Matches the toolchain the project pins in app/build.gradle.kts.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Hilt and Room both run annotation processors; the committed 2 GB heap is sized
      # for a warm desktop daemon and is tight on a cold runner. Overridden here only,
      # so the project's own setting is unchanged.
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace -Dorg.gradle.jvmargs=-Xmx4g

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: redplate-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Room exports each schema version to app/schemas at compile time, and migration
      # tests need those files committed. Where the code is edited there is often no SDK
      # to run KSP, so a bumped database version gets its schema written here instead and
      # pushed back to the same working branch. Never on master: that only gets reviewed merges.
      - name: Commit exported Room schema
        if: github.ref != 'refs/heads/master'
        run: |
          if [ -n "$(git status --porcelain app/schemas)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/schemas
            git commit -m "Export Room schema from CI build"
            git push
          else
            echo "Room schema unchanged."
          fi

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace -Dorg.gradle.jvmargs=-Xmx4g

      # The HTML report says which assertion failed; the console only says how many did.
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
